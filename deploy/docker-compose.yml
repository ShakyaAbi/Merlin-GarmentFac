version: "3.8"

services:
  mysql:
    image: mysql:8.4
    container_name: merlin_mysql
    restart: unless-stopped
    env_file:
      - ./api.env
    volumes:
      - mysqldata:/var/lib/mysql
    # Do NOT publish MySQL to the host to avoid colliding with existing DB services.
    # Containers in this compose can reach MySQL via the service name 'mysql'.
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci"
      ]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  ml:
    build:
      context: ../apps/ml
      dockerfile: Dockerfile
    container_name: merlin_ml
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - PORT=8000

  api:
    image: node:20-alpine
    container_name: merlin_api
    restart: unless-stopped
    working_dir: /usr/src/app
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    volumes:
      - ../apps/api/uploads:/usr/src/app/uploads
      - ./api.env:/usr/src/app/.env:ro
    environment:
      - NODE_ENV=production
    depends_on:
      mysql:
        condition: service_healthy
      ml:
        condition: service_started
    command: sh -c "npx prisma migrate deploy && node dist/server.js"

  web:
    image: nginx:alpine
    container_name: merlin_web
    restart: unless-stopped
    # Bind to a non-conflicting host port so existing host nginx is not affected.
    # Keep the container reachable through the host nginx proxy only.
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ../apps/web/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  mysqldata:
