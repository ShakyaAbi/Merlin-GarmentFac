version: "3.8"

services:
  mysql:
    image: mysql:8.4
    container_name: merlin_mysql
    restart: unless-stopped
    env_file:
      - ./mysql.env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-merlin_mysql}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change_me_root}
      MYSQL_USER: ${MYSQL_USER:-merlin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change_me_user}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      [
        "--default-authentication-plugin=mysql_native_password",
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci"
      ]

volumes:
  mysql_data:

